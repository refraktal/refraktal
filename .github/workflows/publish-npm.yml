name: Publish to npm
# First release: stages the package with a stage-only token (NPM_TOKEN);
# the owner approves it on npmjs.com (Staged Packages) with their own 2FA.
# After the package exists, switch to npm trusted publishing and delete the token.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm stage publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
