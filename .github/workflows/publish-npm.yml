name: Publish to npm
# Token-free: npm trusted publishing (OIDC), staged mode.
# This workflow stages a release; the owner approves it on npmjs.com
# (Staged Packages) with 2FA. No NPM_TOKEN anywhere.
# Release: bump npm/package.json version, run this workflow, approve on npm.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm stage publish --access public
        working-directory: npm
