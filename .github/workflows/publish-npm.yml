name: Publish to npm
# Token-free: npm trusted publishing (OIDC). No NPM_TOKEN.
# npm side: package "refraktal" -> Settings -> Trusted Publisher ->
#   GitHub Actions, org "refraktal", repo "refraktal", workflow "publish-npm.yml".
# Release: bump npm/package.json version, then run this workflow (or push tag npm-vX.Y.Z).
on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm publish --access public --provenance
        working-directory: npm
