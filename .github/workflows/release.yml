name: Release
# Builds the release assets (darwin/linux x arm64/amd64 archives, SHA256SUMS,
# the Homebrew formula) with scripts/release, from a pushed vX.Y.Z tag, and
# attaches them to a DRAFT GitHub release: the owner reviews and publishes it.
# A manual run (workflow_dispatch) is a dry run: it builds and uploads the
# assets as a workflow artifact only, with no release and no tag.
# The npm and PyPI workflows are separate and untouched (PyPI uses py-v* tags).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for the dry run, a semver tag such as v0.1.0-rc.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: build assets
        env:
          # Through the environment, never interpolated into the script.
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: go run ./scripts/release -version "$VERSION" -out dist
      - name: verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "Refraktal $TAG" \
            --notes "Assets built by the Release workflow. Verify with: sha256sum -c SHA256SUMS. The Homebrew formula (refraktal.rb) goes to the tap by hand: see docs/RELEASING.md." \
            dist/*.tar.gz dist/SHA256SUMS dist/refraktal.rb
